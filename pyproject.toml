[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcriber"
version = "0.7.0"
description = "CLI local para transcrição de vídeos com Whisper"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Diego Rodrigues" },
]
dependencies = [
  "ctranslate2==4.8.2",
  "demucs==4.1.0",
  "faster-whisper==1.2.1",
  "openai-whisper==20250625",
  # O CTranslate2 resolve libcublas.so.12 pelo carregador do sistema; em um ambiente
  # com apenas a linha CUDA 13 do PyTorch, a GPU fica inacessível para ele.
  "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
transcriber = "transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
